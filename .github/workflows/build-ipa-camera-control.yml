name: Build IPA - Camera Control branch

on:
  push:
    branches:
      - feature/iphone16-camera-control

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      APP_NAME: DualCam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          sed -i '' -E 's/objectVersion = 77;/objectVersion = 60;/; s/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 60;/' "$APP_NAME.xcodeproj/project.pbxproj"

      - name: Validate Xcode project
        run: xcodebuild -list -project "$APP_NAME.xcodeproj"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name "$APP_NAME.app" | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$APP_NAME.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-ipa-camera-control
          path: DualCam.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-build-log-camera-control
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
