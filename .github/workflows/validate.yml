name: Validate iOS Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and SVG renderer
        run: brew install xcodegen librsvg

      - name: Render App Icon
        run: ./scripts/generate-app-icon.sh

      - name: Generate Xcode project
        run: |
          xcodegen generate
          sed -i '' -E 's/objectVersion = 77;/objectVersion = 60;/; s/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 60;/' DualCam.xcodeproj/project.pbxproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DualCam.xcodeproj \
            -scheme DualCam \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore
