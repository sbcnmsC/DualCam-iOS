name: DualCam iOS IPA (Unsigned)

on:
  push:
    branches: [main, feat/uiux-2026-11-06, fix/aspect-preview-2026-11-13, fix/ui-outputmode-pip-resize-2026-11-14, fix/flash-fill-coordination-2026-11-14, fix/build-202-camera-ui-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Write the ad-hoc export options
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build an unsigned IPA for TestFlight-free installation
        run: |
          xcodebuild -project DualCam.xcodeproj \
            -scheme DualCam -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO clean archive -archivePath "$PWD/build/DualCam"
          mkdir -p "$PWD/build/ipa/Payload"
          ditto "$PWD/build/DualCam.xcarchive/Products/Applications/DualCam.app" "$PWD/build/ipa/Payload/DualCam.app"
          (cd "$PWD/build/ipa" && zip -qry "$PWD/../DualCam-unsigned.ipa" Payload)
          cp ExportOptions.plist "$PWD/build/DualCam-export-options.plist"

      - name: Check archive signature status
        run: |
          codesign -dv "$PWD/build/DualCam.xcarchive/Products/Applications/DualCam.app" || true

      - name: Publish an installable TestFlight-free release
        # Publish a downloadable artifact on every branch. Only create a release on main
        # so feature-branch tests do not replace the stable main release.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DualCam build ${{ github.run_number }} (Unsigned)
          body: |
            DualCam iOS unsigned IPA for self-signing with AltStore / SideStore / TrollStore.
            This is NOT a TestFlight build and requires self-signing to install.
          files: |
            build/DualCam-unsigned.ipa
            build/DualCam-export-options.plist
          draft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: DualCam-build-${{ github.run_number }}
          path: |
            build/DualCam-unsigned.ipa
            build/DualCam-export-options.plist
          retention-days: 7
