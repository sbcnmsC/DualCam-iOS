name: Build IPA

# 推送到 main，或在 Actions 页面手动 Run workflow，都会编译并发布一个 Release。
# - 仓库里配置了签名密钥（见 README）→ 产出「已签名」IPA，可直接安装到登记过的设备
# - 没配置 → 产出「未签名」IPA，用 Sideloadly / AltStore 用自己的 Apple ID 签名后安装
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      APP_NAME: DualCam
      DEFAULT_BUNDLE_ID: com.dualcam.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode version
        run: xcodebuild -version

      - name: Detect signing secrets
        id: sign
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已检测到签名密钥，将生成已签名 IPA"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名密钥，将生成未签名 IPA"
          fi

      # ---------- 已签名 ----------
      - name: Import certificate and provisioning profile
        if: steps.sign.outputs.enabled == 'true'
        id: profile
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 读取描述文件信息
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"
          if [ "$BUNDLE_ID" = "*" ]; then BUNDLE_ID="$DEFAULT_BUNDLE_ID"; fi

          # 开发描述文件 → development；含设备列表的发布描述文件 → ad-hoc
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -q true; then
            METHOD="development"
            IDENTITY="Apple Development"
          else
            METHOD="ad-hoc"
            IDENTITY="Apple Distribution"
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "profile_name=$PROFILE_NAME"
            echo "team_id=$TEAM_ID"
            echo "bundle_id=$BUNDLE_ID"
            echo "method=$METHOD"
            echo "identity=$IDENTITY"
          } >> "$GITHUB_OUTPUT"
          echo "描述文件：$PROFILE_NAME，Team：$TEAM_ID，Bundle ID：$BUNDLE_ID，方式：$METHOD"

      - name: Build and export signed IPA
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          BUNDLE_ID: ${{ steps.profile.outputs.bundle_id }}
          METHOD: ${{ steps.profile.outputs.method }}
          IDENTITY: ${{ steps.profile.outputs.identity }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            archive | tee build.log

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | tee -a build.log

          cp "$RUNNER_TEMP/export/$APP_NAME.ipa" "$APP_NAME.ipa"

      # ---------- 未签名 ----------
      - name: Build unsigned IPA
        if: steps.sign.outputs.enabled != 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name "$APP_NAME.app" | head -n 1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$APP_NAME.ipa" Payload

      - name: Annotate compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.enabled }}
        run: |
          TAG="build-${{ github.run_number }}"
          if [ "$SIGNED" = "true" ]; then
            NOTES="已签名 IPA（仅限描述文件里登记过的设备安装）。提交：${{ github.sha }}"
          else
            NOTES="未签名 IPA，用 Sideloadly / AltStore 以自己的 Apple ID 签名后安装。提交：${{ github.sha }}"
          fi
          gh release create "$TAG" "$APP_NAME.ipa" \
            --repo "${{ github.repository }}" \
            --title "DualCam $TAG" \
            --notes "$NOTES" \
            --latest
