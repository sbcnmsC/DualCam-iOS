name: DualCam

options:
  bundleIdPrefix: com.dualcam
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DualCam:
    type: application
    platform: iOS
    sources:
      - path: DualCam
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: DualCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.dualcam.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
