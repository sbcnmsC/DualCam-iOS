name: DualCam

options:
  bundleIdPrefix: com.dualcam
  deploymentTarget:
    iOS: "17.0"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 155.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DualCam:
    type: application
    platform: iOS
    sources:
      - path: DualCam
        excludes:
          - Info.plist
    dependencies:
      - package: WebRTC
      - target: DualCamLiveActivityExtension
        embed: true
    settings:
      base:
        INFOPLIST_FILE: DualCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.dualcam.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DualCamLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DualCamLiveActivity
      - path: DualCam/LiveActivity/MonitorShareAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualcam.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "9"
        MARKETING_VERSION: "0.3.6"
        INFOPLIST_KEY_CFBundleVersion: "9"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.3.6"
        SKIP_INSTALL: YES
    info:
      path: DualCamLiveActivity/Info.plist
      properties:
        CFBundleShortVersionString: "0.3.6"
        CFBundleVersion: "9"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
