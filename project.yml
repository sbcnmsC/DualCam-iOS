name: DualCam

options:
  bundleIdPrefix: com.dualcam
  # 固定工程文件格式为 Xcode 15.4：新版 XcodeGen 默认生成 Xcode 16 格式，旧 Xcode 打不开
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DualCam:
    type: application
    platform: iOS
    sources:
      - path: DualCam
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: DualCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.dualcam.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
