name: DualCam

options:
  bundleIdPrefix: com.dualcam
  deploymentTarget:
    iOS: "17.0"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 155.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DualCam:
    type: application
    platform: iOS
    sources:
      - path: DualCam
        excludes:
          - Info.plist
    dependencies:
      - package: WebRTC
    settings:
      base:
        INFOPLIST_FILE: DualCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.dualcam.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
